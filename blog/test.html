<!--
  How to publish a post:
  1. Copy this file to blog/<slug>.html, e.g. blog/agent-heartbeat.html.
     It will live at cleidergomez.com/blog/agent-heartbeat
  2. Replace everything marked POST-SLUG, POST TITLE, ONE-SENTENCE SUMMARY and the dates.
  3. Delete the "noindex" line below. It only keeps this template out of search results.
  4. List the post's <h2> sections in the side nav (<nav class="toc">).
  5. Add the post to the top of the list in blog/index.html (and to "Writing" on index.html).
-->
